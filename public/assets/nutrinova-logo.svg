<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Optional subtle background handled by container; default white / transparent -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800&amp;family=Plus+Jakarta+Sans:wght@700&amp;display=swap');
      .brand-title {
        font-family: 'Outfit', 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 50px;
        fill: #2E6930;
      }
      .brand-tagline {
        font-family: 'Plus Jakarta Sans', 'Outfit', 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 24px;
        fill: #181818;
        letter-spacing: 0.8px;
      }
    </style>
  </defs>

  <!-- 1. Central Warm Golden Sun / Citrus Circle -->
  <circle cx="200" cy="80" r="28" fill="#F5A623" />

  <!-- 2. Left Leaf -->
  <!-- Outer leaf contour: starts at base (194, 206), arcs out to (58, 46), returns inward to (180, 150) -->
  <path
    d="M 194 206 C 140 186, 70 128, 58 46 C 104 62, 162 98, 180 150 Z"
    fill="#8DC63F"
    stroke="#2E6930"
    stroke-width="5"
    stroke-linejoin="round"
  />
  <!-- Left Leaf Vein Line -->
  <path
    d="M 194 206 C 148 168, 102 118, 62 52"
    fill="none"
    stroke="#2E6930"
    stroke-width="4.5"
    stroke-linecap="round"
  />

  <!-- 3. Right Leaf -->
  <!-- Outer leaf contour: starts at base (206, 206), arcs out to (342, 46), returns inward to (220, 150) -->
  <path
    d="M 206 206 C 260 186, 330 128, 342 46 C 296 62, 238 98, 220 150 Z"
    fill="#8DC63F"
    stroke="#2E6930"
    stroke-width="5"
    stroke-linejoin="round"
  />
  <!-- Right Leaf Vein Line -->
  <path
    d="M 206 206 C 252 168, 298 118, 338 52"
    fill="none"
    stroke="#2E6930"
    stroke-width="4.5"
    stroke-linecap="round"
  />

  <!-- 4. Stem / Junction -->
  <path
    d="M 198 206 C 197 218, 194 226, 190 234"
    fill="none"
    stroke="#2E6930"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- 5. Brand Wordmark: "Nutri Nova" -->
  <text x="200" y="296" text-anchor="middle" class="brand-title">Nutri Nova</text>

  <!-- 6. Tagline: "Nutritious Lifestyle" -->
  <text x="200" y="348" text-anchor="middle" class="brand-tagline">Nutritious Lifestyle</text>
</svg>
